title: New doors, mantel or surround
path: existing-fireplace
order: 3
homepage: false
whatItIs: Made-to-measure glass doors, a custom mantel, or a new surround fitted to the fireplace you already have.
goodFor: A fireplace that works but looks dated, or one you want to finish properly after a conversion.
benefit: Changes how the whole room looks without replacing the fireplace.
facts:
  - Doors and mantels are made to your fireplace dimensions. They are not stocked in standard sizes.
  - You can choose from our fabricators' styles or bring a photo of something you like.
considerations:
  - Accurate measurements of the opening.
  - Clearances between the fireplace and any combustible mantel material.
  - Lead time for made-to-order pieces.
exampleBrands: [Stoll Industries, Design Specialties, Ironhaus, Omega Mantels of Stone]
