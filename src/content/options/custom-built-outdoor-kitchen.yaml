title: Custom-built outdoor kitchen
path: outdoor-kitchen
order: 1
homepage: true
whatItIs: A masonry or stone-finished island built on site around a built-in grill, with the storage, refrigeration and counter space you choose.
goodFor: Backyards and patios where the kitchen should look like part of the house and landscape.
benefit: A kitchen laid out around how you cook and entertain, designed before anything is built.
facts:
  - The grill and appliances set the cut-out sizes, so equipment is chosen before the island is built.
  - We prepare 3D layouts to go along with an outdoor kitchen purchase.
considerations:
  - Where gas, water and electricity will come from.
  - Counter space on both sides of the grill.
  - What else belongs in it, such as a side burner, refrigerator, sink, pizza oven or bar seating.
  - Overhead cover and ventilation if the kitchen sits under a roof or pergola.
included:
  - The appliances and components listed in your quote.
separate:
  - Utility connections by licensed trades.
  - Patio, hardscape or landscaping work, unless it is part of the agreed scope.
exampleBrands: [Twin Eagles, Lynx, Fire Magic, XO, True Residential]
