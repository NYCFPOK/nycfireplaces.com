title: Traditional direct-vent gas fireplace
path: new-fireplace
order: 2
homepage: false
whatItIs: A gas fireplace with a classic log fire and a taller, squarer opening, sealed behind glass and vented directly outside.
goodFor: Living rooms and family rooms where you want the look of a traditional hearth, with or without a mantel.
benefit: The familiar fireplace look with dependable heat and no wood to carry.
facts:
  - No chimney or existing fireplace is required. It can be fitted on interior or exterior walls where a vent route exists.
  - Many models are offered with a traditional log set or a contemporary glass media bed.
considerations:
  - The vent route and gas supply.
  - Clearances to a mantel and any combustible finishes, set by the manufacturer.
  - How much heat the room actually needs.
included:
  - The fireplace appliance as specified in your quote.
separate:
  - Venting components, gas and electrical work.
  - Mantel, surround and wall finish.
