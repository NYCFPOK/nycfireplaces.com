title: Outdoor kitchen with weatherproof cabinetry
path: outdoor-kitchen
order: 2
homepage: true
whatItIs: An outdoor kitchen built from stainless or aluminum cabinetry in a powder-coated color, with a stone or porcelain countertop.
goodFor: Terraces, rooftops and patios where a lighter structure, a precise fit, or a furniture-like finish matters.
benefit: The look and storage of an indoor kitchen, in materials made to live outside.
facts:
  - Cabinetry is ordered to a layout, so the design is settled before production.
  - Powder-coated finishes come in a range of colors.
considerations:
  - Accurate site measurements and a level base.
  - Gas, water and power locations.
  - Weight limits and access on rooftops and terraces.
included:
  - The cabinetry and appliances listed in your quote.
separate:
  - Countertop fabrication, unless it is part of the agreed scope.
  - Utility connections by licensed trades.
